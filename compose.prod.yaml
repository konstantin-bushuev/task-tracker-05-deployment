services:
  postgres:
    ports: !reset []

    restart: unless-stopped

  app:
    ports: !reset []

    environment:
      SPRING_PROFILES_ACTIVE: prod

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: task-tracker-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
