spring:
  application:
    name: task-tracker-05-deployment

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}
    username: ${DB_USERNAME:task_tracker}
    password: ${DB_PASSWORD:task_tracker}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false